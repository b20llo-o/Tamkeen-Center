<style>
  html, body { margin: 0; height: 100%; background: #F4EFE3; font-family: 'Segoe UI', Tahoma, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #6E5B3D; }
  a { color: #8C6F47; font-weight: 700; font-size: 18px; text-decoration: none; padding: 12px 22px; border: 1px solid #E2D7BF; border-radius: 12px; background: #FCFAF3; }
  .spin { width: 34px; height: 34px; border: 3px solid #E2D7BF; border-top-color: #8C6F47; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>

<body>
<div class="wrap">
  <div class="spin"></div>
  <p>جارٍ فتح منظومة مركز تمكين…</p>
